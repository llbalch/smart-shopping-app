# Production Configuration (Render)
# Render provides DATABASE_URL automatically when you provision a PostgreSQL database

# Security settings for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production CORS - update with your deployed frontend URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-app.onrender.com}
